name: Keep Supabase Alive

on:
  schedule:
    # Monday and Thursday at 07:00 UTC — well within Supabase's 7-day inactivity window.
    - cron: "0 7 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production keep-alive endpoint
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KEEP_ALIVE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping: set KEEP_ALIVE_URL and CRON_SECRET repository secrets."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${KEEP_ALIVE_URL}"
